name: Windows x64 Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-windows-x64:

    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Lazarus 4.8 and FPC 3.2.2
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'lazarus-4.8-fpc-3.2.2-win64.exe'
        & curl.exe --fail --location --retry 3 --output $installer 'https://fossies.org/windows/misc/lazarus-4.8-fpc-3.2.2-win64.exe'
        if ($LASTEXITCODE -ne 0) {
          throw "Could not download the Lazarus installer (curl exit code $LASTEXITCODE)."
        }
        if ((Get-FileHash -Algorithm SHA256 -Path $installer).Hash -ne 'ED25EE171D55E23CF14E0633159FDD2325EFBA56E186F8AB817AD3BF97D267D7') {
          throw 'Unexpected Lazarus installer SHA-256.'
        }
        $signature = Get-AuthenticodeSignature -FilePath $installer
        if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Programming Free Pascal') {
          throw "Unexpected Lazarus installer signature: $($signature.Status) / $($signature.SignerCertificate.Subject)"
        }
        Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\tools\Lazarus-4.8' -Wait -NoNewWindow

    - name: Build and test Win64
      shell: pwsh
      env:
        BUILD_COMMIT: ${{ github.sha }}
      run: .\build-windows.ps1 -LazarusDir C:\tools\Lazarus-4.8

    - uses: actions/upload-artifact@v4
      with:
        name: TransGUI Windows x64
        path: dist\windows-x64
        if-no-files-found: error
